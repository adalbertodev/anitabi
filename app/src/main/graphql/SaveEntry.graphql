mutation SaveEntry($entryId: Int, $mediaId: Int, $progress: Int, $status: MediaListStatus, $score: Float, $notes: String) {
    SaveMediaListEntry(id: $entryId, mediaId: $mediaId, progress: $progress, status: $status, score: $score, notes: $notes) {
        id
        progress
        status
        score
        notes
        updatedAt
    }
}